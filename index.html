<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>PDF Date Filler</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f7f8fa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 48px 20px; }
      main { max-width: 680px; margin: 0 auto; }
      h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -0.04em; }
      .intro { margin: 10px 0 28px; color: #596579; line-height: 1.55; }
      form { display: grid; gap: 18px; padding: 24px; background: white; border: 1px solid #e1e6ed; border-radius: 16px; box-shadow: 0 12px 32px #1822300d; }
      label { display: grid; gap: 8px; font-weight: 650; }
      input[type="file"], input[type="date"] { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #cbd3df; border-radius: 9px; background: white; color: inherit; font: inherit; }
      input[type="file"] { padding: 8px; }
      .hint { margin: -10px 0 0; color: #667085; font-size: 0.88rem; line-height: 1.45; }
      button { min-height: 48px; border: 0; border-radius: 9px; padding: 12px 18px; background: #1769d2; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover:not(:disabled) { background: #1056b2; }
      button:disabled { cursor: wait; opacity: 0.65; }
      #status { min-height: 24px; margin: 16px 2px 0; color: #39465a; line-height: 1.5; }
      #status.error { color: #b42318; }
      #status.success { color: #067647; }
      @media (max-width: 520px) { body { padding: 30px 14px; } form { padding: 18px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>PDF Date Filler</h1>
      <p class="intro">Upload one PDF, choose the date to insert, then download the filled document.</p>
      <form id="fill-form">
        <label for="pdf-file">PDF document
          <input id="pdf-file" name="pdf" type="file" accept="application/pdf,.pdf" required />
        </label>
        <p class="hint">Prototype limit: 4 MB per PDF. This keeps uploads within Vercel Function request limits.</p>
        <label for="date">Date to insert
          <input id="date" name="date" type="date" required />
        </label>
        <button id="submit" type="submit">Fill PDF</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#fill-form");
      const fileInput = document.querySelector("#pdf-file");
      const dateInput = document.querySelector("#date");
      const submitButton = document.querySelector("#submit");
      const status = document.querySelector("#status");
      const localToday = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
        .toISOString().slice(0, 10);
      dateInput.value = localToday;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          status.className = "error";
          status.textContent = "This prototype accepts PDFs up to 4 MB.";
          return;
        }

        submitButton.disabled = true;
        status.className = "";
        status.textContent = "Processing PDF…";
        try {
          const params = new URLSearchParams({ date: dateInput.value, filename: file.name });
          const response = await fetch(`/api/process?${params}`, {
            method: "POST",
            headers: { "Content-Type": "application/pdf" },
            body: file,
          });
          if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || `Processing failed (${response.status}).`);
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          const disposition = response.headers.get("Content-Disposition") || "";
          const filename = disposition.match(/filename\*=UTF-8''([^;]+)/i)?.[1];
          link.download = filename ? decodeURIComponent(filename) : "filled.pdf";
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 60000);
          status.className = "success";
          status.textContent = "Done. Your filled PDF has been downloaded.";
        } catch (error) {
          status.className = "error";
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
